<body>
<section id="workspace" class="workspace variant-a" aria-label="LogicMargin 布局原型">
<header class="globalbar">
 <div class="brand"><span class="brandmark" aria-hidden="true">↳</span><span class="brand-name">LogicMargin</span></div><span class="bar-rule"></span>
 <div class="document"><h1>魔灵秘境</h1><span class="prototype-label">布局原型 · 不保存批注</span></div>
 <span class="save">原型 · 不保存</span><div class="global-actions"><button id="metadata-button" aria-label="查看版本与评审范围">ⓘ<span class="button-text"> 版本与范围</span></button><button class="less-important" id="file-button">文件</button><button class="primary" id="submit-button">提交本轮</button></div>
</header>
<div class="toolbar">
 <button class="scene-trigger" id="scene-trigger" aria-expanded="false">☷ 入场与配置校验 ▾</button>
 <span class="caption" id="scene-count"></span><span class="spacer"></span>
 <button id="pan-button" class="active desktop-only">浏览</button><button id="select-button" class="desktop-only">框选</button>
 <span class="direction-label caption">方向</span><select id="direction" aria-label="流程方向"><option value="horizontal">横向主线</option><option value="vertical">纵向流程</option></select>
 <button id="detail-button">详情</button><button id="focus-button" class="optional">专注画布 ⤢</button>
</div>
<div class="content">
 <nav class="rail" aria-label="工具导航"><button id="rail-scenes" aria-label="打开场景导航">☷</button><button id="rail-detail" aria-label="查看步骤详情">▤</button><button id="rail-notes" aria-label="批注交互说明">▢</button><div class="grow"></div><span class="rail-text">5 个<br>场景</span><button id="rail-focus" aria-label="专注画布">⤢</button></nav>

<script>
'use strict';
const review=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
const variants={A:{name:'A · 画布优先（推荐）',note:'<strong>推荐 A：</strong>默认只留下两条紧凑工具带，场景收在左侧工具轨；详情按需打开。默认保留纵向阅读，左右空间留给失败分支与按需讨论；可显式切换横向比较，“专注画布”再收起界面。'},B:{name:'B · 全高纵向审阅',note:'<strong>保守方案 B：</strong>保留熟悉的纵向流程和固定场景目录，移除大标题与多段说明。优先回收纵向空间，不改变图的阅读方向。'},C:{name:'C · 分段阅读',note:'<strong>方案 C：</strong>将长流程按几步一段横向阅读，步骤说明放在下方；上一段/下一段保留可读字号。适合逐条业务复核，整体关系需要借助概览。'}};
const kindLabels={action:'操作',decision:'判断',result:'结果',failure:'失败出口'};
const state={variant:'A',scene:review.scenes[0].id,direction:'vertical',panel:false,focus:false,bottom:true,selected:null,segment:0,zoom:.9,x:40,y:100,positions:new Map(),width:0,height:0,drag:null};
const initial=new URLSearchParams(location.search).get('variant'); if(variants[initial])state.variant=initial;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nodes(){return review.nodes.filter(n=>n.sceneId===state.scene)}
function scene(){return review.scenes.find(s=>s.id===state.scene)}
function sceneButtons(){const content=review.scenes.map((s,i)=>`<button class="scene-option ${s.id===state.scene?'active':''}" data-scene="${esc(s.id)}"><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(s.title)}</strong><small>${review.nodes.filter(n=>n.sceneId===s.id).length} 个步骤</small></span></button>`).join('');$('fixed-scenes').innerHTML=content;$('popover-scenes').innerHTML=content;document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=b.dataset.scene;state.selected=null;state.segment=0;$('workspace').classList.remove('nav-open');render();resetView()});}
function applyTransform(){ $('graph').style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;$('zoom-label').textContent=`${Math.round(state.zoom*100)}%`;$('status').textContent=`${state.variant} · ${state.direction==='horizontal'?'横向':'纵向'} · ${scene().title} · ${state.panel?'详情展开':'画布阅读'}${state.zoom<.7?' · 概览，点击节点恢复阅读':''}`;}
function positionNodes(){state.positions=new Map();const list=nodes();list.forEach(n=>{const p=state.direction==='vertical'?{x:n.position.x*.85,y:n.position.y*.92}:{x:n.position.y*1.8,y:n.position.x*.76};state.positions.set(n.id,p)});state.width=Math.max(...list.map(n=>state.positions.get(n.id).x+216))+30;state.height=Math.max(...list.map(n=>state.positions.get(n.id).y+112))+30;}
function graphMarkup(){positionNodes();const links=review.edges.filter(e=>e.sceneId===state.scene).map(e=>{const a=state.positions.get(e.source),b=state.positions.get(e.target);let sx,sy,tx,ty,d,lx,ly;if(state.direction==='horizontal'){sx=a.x+216;sy=a.y+56;tx=b.x;ty=b.y+56;const mid=sx+(tx-sx)/2;d=`M${sx},${sy}H${mid}V${ty}H${tx}`;lx=mid;ly=sy===ty?sy-8:(sy+ty)/2-6;}else{sx=a.x+108;sy=a.y+112;tx=b.x+108;ty=b.y;const mid=sy+(ty-sy)/2;d=`M${sx},${sy}V${mid}H${tx}V${ty}`;lx=sx===tx?sx+8:(sx+tx)/2;ly=mid-7;}return `<path class="edge" d="${d}" marker-end="url(#arrow)"/><text class="edge-label" x="${lx}" y="${ly}">${esc(e.label)}</text>`}).join('');const cards=nodes().map((n,i)=>{const p=state.positions.get(n.id);return `<button class="node ${n.kind} ${state.selected===n.id?'selected':''}" data-node="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px" aria-label="查看步骤：${esc(n.title)}"><span class="kind">${kindLabels[n.kind]}</span><span class="step-number">${String(i+1).padStart(2,'0')}</span><strong>${esc(n.title)}</strong><span class="summary">${esc(n.summary)}</span></button>`}).join('');$('graph').innerHTML=`<svg width="${state.width}" height="${state.height}" aria-hidden="true"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--color-edge)"/></marker></defs>${links}</svg>${cards}`;document.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>selectNode(el.dataset.node));drawMinimap();applyTransform();}
function drawMinimap(){const list=nodes();$('minimap').setAttribute('viewBox',`-12 -12 ${state.width+24} ${state.height+24}`);$('minimap').innerHTML=list.map(n=>{const p=state.positions.get(n.id);return `<rect class="${n.kind==='failure'?'failure-map':''} ${state.selected===n.id?'selected-map':''}" x="${p.x}" y="${p.y}" width="216" height="112" rx="8"/>`}).join('');}
function detailMarkup(){const n=review.nodes.find(n=>n.id===state.selected)||nodes()[0];$('detail').innerHTML=`<div class="eyebrow">${kindLabels[n.kind]} · ${esc(scene().title)}</div><h2>${esc(n.title)}</h2><section class="detail-section"><h3>这里发生什么</h3><p>${esc(n.detail)}</p></section><section class="detail-section"><h3>数据变化</h3><div class="state-pair"><div><span>执行前</span><strong>${esc(n.input)}</strong></div><div><span>执行后</span><strong>${esc(n.output)}</strong></div></div></section><section class="detail-section"><h3>源码依据 · ${n.evidence.length} 处</h3>${n.evidence.map(e=>`<div class="evidence-item"><code>${esc(e.symbol)}</code><br>${esc(e.path)}:${e.startLine}–${e.endLine}</div>`).join('')}</section><p class="prototype-note">布局原型，只验证空间与阅读方式。没有真实讨论、提交或批注保存；业务说明来自当前魔灵秘境评审快照。</p>`;$('bottom-title').textContent=n.title;$('bottom-body').innerHTML=`<div><h3>业务规则</h3><p>${esc(n.detail)}</p></div><div><h3>执行前</h3><p>${esc(n.input)}</p></div><div><h3>执行后</h3><p>${esc(n.output)}</p></div>`;}
function render(){const root=$('workspace');root.className=`workspace variant-${state.variant.toLowerCase()}${state.panel?' panel-open':''}${state.focus?' focus-mode':''}`;if(state.variant==='B')state.direction='vertical';if(state.variant==='C')state.direction='horizontal';$('direction').value=state.direction;$('direction').disabled=state.variant!=='A';$('scene-trigger').textContent=`☷ ${scene().title} ▾`;$('scene-count').textContent=`${nodes().length} 个步骤`;$('scene-caption').textContent=state.variant==='B'?`${scene().title} · 纵向可读视图`:'选择一个步骤查看规则与证据';$('variant-name').textContent=variants[state.variant].name;$('explanation').innerHTML=variants[state.variant].note;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===state.variant));$('bottom-detail').hidden=!state.bottom;$('bottom-toggle').textContent=state.bottom?'收起步骤说明':'展开步骤说明';$('revision').textContent=review.revision;sceneButtons();detailMarkup();graphMarkup();const groups=Math.max(1,Math.ceil(nodes().filter(n=>n.position.x===0).length/3));state.segment=Math.min(state.segment,groups-1);$('segment-label').textContent=`第 ${state.segment+1} / ${groups} 段`;$('segment-prev').disabled=state.segment===0;$('segment-next').disabled=state.segment===groups-1;}
function resetView(){state.zoom=innerWidth<700?.88:.9;state.x=state.direction==='vertical'?Math.max(24,($('canvas').clientWidth-state.width)/2):(innerWidth<700?30:40);state.y=state.direction==='vertical'?62:Math.max(80,Math.min(150,$('canvas').clientHeight*.21));if(state.variant==='C'){state.x=28;state.y=70;}applyTransform();}
function selectNode(id){state.selected=id;if(state.variant!=='C')state.panel=true;state.zoom=Math.max(state.zoom,.85);render();requestAnimationFrame(()=>focusSelected());}
function focusSelected(){const p=state.positions.get(state.selected);if(!p)return;const c=$('canvas');state.x=Math.max(24,(c.clientWidth-216*state.zoom)/2)-p.x*state.zoom;const availableHeight=state.panel&&innerWidth<=700?c.clientHeight*.46:c.clientHeight;state.y=Math.max(56,(availableHeight-112*state.zoom)/2)-p.y*state.zoom;applyTransform();}
function setPanel(value){state.panel=value;if(value&&!state.selected)state.selected=nodes()[0].id;render();requestAnimationFrame(()=>value?focusSelected():applyTransform());}
function chooseVariant(key){state.variant=key;state.panel=false;state.focus=false;state.segment=0;if(key==='A')state.direction='vertical';const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);render();resetView();}
function cycleVariant(delta){const keys=Object.keys(variants);chooseVariant(keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length]);}
function showToast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').hidden=true,2600);}
function toggleNav(){const open=$('workspace').classList.toggle('nav-open');$('workspace').classList.remove('meta-open');$('scene-trigger').setAttribute('aria-expanded',String(open));}
$('pan-button').onclick=()=>{$('pan-button').classList.add('active');$('select-button').classList.remove('active');showToast('浏览模式：拖动画布或滚轮平移。')};$('select-button').onclick=()=>{$('select-button').classList.add('active');$('pan-button').classList.remove('active');showToast('框选仅示意工具位置，原型不创建真实选区或批注。')};$('scene-trigger').onclick=toggleNav;$('rail-scenes').onclick=toggleNav;$('close-nav').onclick=()=>$('workspace').classList.remove('nav-open');$('metadata-button').onclick=()=>{$('workspace').classList.toggle('meta-open');$('workspace').classList.remove('nav-open')};$('close-meta').onclick=()=>$('workspace').classList.remove('meta-open');$('file-button').onclick=()=>showToast('布局原型不执行文件操作；正式版的导入与导出可收在此处。');$('submit-button').onclick=()=>showToast('布局原型不提交意见；正式版保留当前已确认的提交流程。');$('rail-notes').onclick=()=>showToast('批注入口保留在对象附近；此原型只评估阅读空间，不保存意见。');$('detail-button').onclick=() => setPanel(!state.panel);$('rail-detail').onclick=()=>setPanel(!state.panel);$('close-detail').onclick=()=>setPanel(false);function toggleFocus(){state.focus=!state.focus;render();requestAnimationFrame(applyTransform)}$('focus-button').onclick=toggleFocus;$('rail-focus').onclick=toggleFocus;$('focus-exit').onclick=toggleFocus;$('direction').onchange=e=>{state.direction=e.target.value;render();resetView()};$('previous-variant').onclick=()=>cycleVariant(-1);$('next-variant').onclick=()=>cycleVariant(1);document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>chooseVariant(b.dataset.variant));function zoomBy(factor){const c=$('canvas'),before=state.zoom;state.zoom=Math.min(1.5,Math.max(.3,before*factor));state.x=c.clientWidth/2-(c.clientWidth/2-state.x)*state.zoom/before;state.y=c.clientHeight/2-(c.clientHeight/2-state.y)*state.zoom/before;applyTransform();}$('zoom-in').onclick=()=>zoomBy(1.15);$('zoom-out').onclick=()=>zoomBy(1/1.15);function fit(){const c=$('canvas');state.zoom=Math.min(.95,Math.max(.25,Math.min((c.clientWidth-60)/state.width,(c.clientHeight-95)/state.height)));state.x=(c.clientWidth-state.width*state.zoom)/2;state.y=55;applyTransform();showToast('概览用于找位置；点击步骤恢复可读比例。')}$('fit').onclick=fit;$('minimap').onclick=fit;$('minimap').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fit()}};$('read-size').onclick=()=>{state.zoom=1;if(state.selected)focusSelected();else resetView();};$('bottom-toggle').onclick=()=>{state.bottom=!state.bottom;render()};$('bottom-open').onclick=()=>{if(state.variant==='C')showToast('完整依据在正式版复核面板按需展开；此处先比较下栏布局。');else setPanel(true)};function segment(delta){const main=nodes().filter(n=>n.position.x===0);state.segment=Math.max(0,Math.min(Math.ceil(main.length/3)-1,state.segment+delta));state.selected=main[state.segment*3].id;render();state.zoom=Math.min(.95,Math.max(.7,($('canvas').clientWidth-60)/(216*3+50*2)));const p=state.positions.get(state.selected);state.x=24-p.x*state.zoom;state.y=70;applyTransform();}$('segment-prev').onclick=()=>segment(-1);$('segment-next').onclick=()=>segment(1);
const canvas=$('canvas');canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.minimap'))return;state.drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:state.x,y:state.y};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!state.drag)return;state.x=state.drag.x+e.clientX-state.drag.startX;state.y=state.drag.y+e.clientY-state.drag.startY;applyTransform()});function endDrag(){state.drag=null;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoomBy(e.deltaY<0?1.08:1/1.08);else{if(state.direction==='horizontal')state.x-=e.deltaY+e.deltaX;else state.y-=e.deltaY;applyTransform()}},{passive:false});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycleVariant(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycleVariant(1)}if(e.key==='Escape'){state.focus=false;state.panel=false;$('workspace').classList.remove('nav-open','meta-open');render()}});let resizeFrame;function resize(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(window.top===window.self)document.documentElement.style.setProperty('--demo-height',`${Math.max(480,Math.min(1100,innerHeight-132))}px`);applyTransform()})}window.addEventListener('resize',resize);render();resetView();resize();console.assert(review.scenes.length===5&&review.comments.length===0,'Prototype must show real unannotated requirement data');
