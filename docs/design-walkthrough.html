<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogicMargin 设计流程演示</title>
<style>
:root {
  color-scheme: light dark;
  --lm-paper: light-dark(oklch(98% .004 250), oklch(19% .012 250));
  --lm-surface: light-dark(oklch(99.5% .002 250), oklch(24% .015 250));
  --lm-soft: light-dark(oklch(96.5% .006 250), oklch(21.5% .014 250));
  --lm-ink: light-dark(oklch(26% .025 258), oklch(94% .008 250));
  --lm-muted: light-dark(oklch(49% .023 258), oklch(74% .018 250));
  --lm-line: light-dark(oklch(83% .012 250), oklch(42% .02 250));
  --lm-blue: light-dark(oklch(49% .19 262), oklch(78% .12 262));
  --lm-blue-paper: light-dark(oklch(95% .026 262), oklch(31% .065 262));
  --lm-blue-ink: light-dark(oklch(99% .005 262), oklch(19% .025 262));
  --lm-green: light-dark(oklch(39% .09 160), oklch(77% .11 160));
  --lm-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
}
html, body { margin: 0; background: transparent; color: var(--lm-ink); font-family: var(--lm-font); }
#lm-design { min-width: 0; }
#lm-design * { box-sizing: border-box; }
#lm-design button, #lm-design textarea { font: inherit; }
#lm-design button { white-space: nowrap; }
#lm-design p, #lm-design h2, #lm-design h3 { margin: 0; }
#lm-design .stages { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-right: 90px; }
#lm-design .stage { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 10px; color: var(--lm-muted); border: 0; border-bottom: 2px solid transparent; background: transparent; }
#lm-design .stage[aria-current="step"] { border-bottom-color: var(--lm-blue); color: var(--lm-blue); }
#lm-design .stage span { font-variant-numeric: tabular-nums; }
#lm-design .product-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px; background: var(--lm-surface); border-bottom: 1px solid var(--lm-line); }
#lm-design .product-header strong { font-weight: 500; }
#lm-design .design-label { color: var(--lm-muted); font-size: 12px; }
#lm-design .review-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--lm-soft); font-size: 12px; }
#lm-design .review-meta b { font-weight: 500; }
#lm-design .layout { display: grid; grid-template-columns: 130px minmax(0, 1fr) 280px; background: var(--lm-paper); }
#lm-design .scenes { padding: 20px 12px; background: var(--lm-soft); border-right: 1px solid var(--lm-line); }
#lm-design .scene-title { color: var(--lm-muted); margin-bottom: 12px; font-size: 12px; }
#lm-design .scene { padding: 10px 8px; font-size: 13px; }
#lm-design .scene.chosen { background: var(--lm-blue-paper); color: var(--lm-blue); }
#lm-design .graph { min-width: 0; padding: 20px 16px; }
#lm-design .graph-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
#lm-design h2 { font-size: 16px; font-weight: 500; }
#lm-design .graph-heading small { color: var(--lm-muted); }
#lm-design .node { display: block; width: 100%; max-width: 320px; margin: 0 auto; padding: 12px; text-align: left; color: var(--lm-ink); border: 1px solid var(--lm-line); border-radius: 6px; background: var(--lm-surface); white-space: normal; }
#lm-design .node .kind { display: block; color: var(--lm-muted); font-size: 12px; margin-bottom: 4px; }
#lm-design .node strong { display: block; font-weight: 500; font-size: 14px; }
#lm-design .node small { display: block; color: var(--lm-muted); margin-top: 6px; font-size: 12px; }
#lm-design .arrow { text-align: center; padding: 4px; color: var(--lm-muted); }
#lm-design .selected-group { margin: 0 auto; max-width: 344px; padding: 10px; border: 1px solid transparent; border-radius: 6px; }
#lm-design .selected-group.selected { border: 1px dashed var(--lm-blue); background: var(--lm-blue-paper); }
#lm-design .selection-note { font-size: 12px; color: var(--lm-blue); margin-bottom: 8px; }
#lm-design .delta { margin-top: 8px; color: var(--lm-green); font-size: 12px; }
#lm-design .result { margin: 10px auto 0; max-width: 320px; color: var(--lm-muted); font-size: 12px; }
#lm-design .result strong { color: var(--lm-ink); font-weight: 500; }
#lm-design .discussion { min-width: 0; padding: 20px 16px; border-left: 1px solid var(--lm-line); background: var(--lm-surface); }
#lm-design h3 { font-size: 14px; font-weight: 500; }
#lm-design .discussion-content { margin-top: 12px; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
#lm-design .discussion-content > * + * { margin-top: 12px; }
#lm-design .tag { display: inline-block; color: var(--lm-blue); font-size: 12px; }
#lm-design .thread { padding-left: 12px; border-left: 2px solid var(--lm-line); }
#lm-design .thread p + p { margin-top: 6px; }
#lm-design .who { color: var(--lm-muted); font-size: 12px; }
#lm-design .reply { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--lm-line); }
#lm-design textarea { width: 100%; min-height: 110px; resize: vertical; padding: 10px; border: 1px solid var(--lm-line); border-radius: 6px; background: var(--lm-paper); color: var(--lm-ink); }
#lm-design .action-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
#lm-design .action { min-height: 40px; padding: 8px 12px; border: 1px solid var(--lm-line); border-radius: 6px; color: var(--lm-ink); background: var(--lm-surface); }
#lm-design .action.primary { border-color: var(--lm-blue); background: var(--lm-blue); color: var(--lm-blue-ink); }
#lm-design .action:disabled { opacity: .5; cursor: not-allowed; }
#lm-design .snapshot { font-size: 12px; color: var(--lm-muted); border-top: 1px solid var(--lm-line); padding-top: 12px; }
#lm-design details { margin-top: 16px; font-size: 12px; color: var(--lm-muted); }
#lm-design summary { min-height: 32px; }
#lm-design .step-note { display: flex; gap: 12px; align-items: flex-start; padding: 16px 0 0; color: var(--lm-muted); font-size: 13px; }
#lm-design .step-note strong { font-weight: 500; color: var(--lm-ink); white-space: nowrap; }
@media (max-width: 900px) { #lm-design .layout { grid-template-columns: minmax(0, 1fr) 270px; } #lm-design .scenes { display: none; } }
@media (max-width: 600px) { #lm-design .layout { grid-template-columns: minmax(0, 1fr); } #lm-design .discussion { border-left: 0; border-top: 1px solid var(--lm-line); } #lm-design .stages { padding-right: 0; } #lm-design .step-note { flex-direction: column; gap: 6px; } #lm-design textarea { font-size: 16px; } }
</style>
</head>
<body>
<div id="lm-design">
  <nav class="stages" aria-label="选择演示阶段">
    <button type="button" class="stage cursor-interaction" data-stage="0"><span>1</span> 看逻辑</button>
    <button type="button" class="stage cursor-interaction" data-stage="1"><span>2</span> 图上批注</button>
    <button type="button" class="stage cursor-interaction" data-stage="2"><span>3</span> 提交本轮</button>
    <button type="button" class="stage cursor-interaction" data-stage="3"><span>4</span> 代理回应</button>
    <button type="button" class="stage cursor-interaction" data-stage="4"><span>5</span> 复核结果</button>
  </nav>
  <header class="product-header"><strong>LogicMargin · 通灵技能评审</strong><span class="design-label">拟议方案 · 操作演示</span></header>
  <div class="review-meta" aria-live="polite"><span id="lm-version"></span><b id="lm-round"></b><span id="lm-comment-status"></span></div>
  <div class="layout">
    <aside class="scenes" aria-label="场景目录示意"><div class="scene-title">场景</div><div class="scene">升级总等级</div><div class="scene chosen">解锁新技能</div><div class="scene">上阵与卸下</div></aside>
    <main class="graph">
      <div class="graph-heading"><h2>解锁新技能</h2><small id="lm-graph-mode">现状逻辑</small></div>
      <div class="node"><span class="kind">前置校验</span><strong>功能开放，职业符合，尚未解锁</strong><small>不满足条件 → 拒绝操作</small></div>
      <div class="arrow" aria-hidden="true">↓</div>
      <div class="selected-group" id="lm-selected">
        <div class="selection-note" id="lm-selection-note" hidden>已圈选 3 个步骤 · 1 条意见</div>
        <div class="node"><span class="kind">判断</span><strong>检查解锁资源</strong><small>不足 → 返回失败，保留养成状态</small></div>
        <div class="arrow" aria-hidden="true">↓</div>
        <div class="node"><span class="kind">操作</span><strong>扣除本次解锁费用</strong></div>
        <div class="arrow" aria-hidden="true">↓</div>
        <div class="node"><span class="kind">状态变化</span><strong>增加新技能的解锁资格</strong><small id="lm-node-output">查看总等级、解锁集合与上阵选择</small><div class="delta" id="lm-delta" hidden>已补全：等级保持，上阵选择保持</div></div>
      </div>
      <div class="result"><strong>结果：</strong><span id="lm-result">查看步骤细节，核对规则与失败出口。</span></div>
      <details><summary>源码依据与未展示范围</summary><p>正式界面可展开源码位置、验证依据及未展示分支。本演示使用示意版本，不连接仓库。</p></details>
    </main>
    <aside class="discussion" aria-label="批注与回应示意">
      <h3 id="lm-panel-title">选中步骤的详情</h3>
      <div id="lm-discussion" class="discussion-content"></div>
      <div class="action-row"><button type="button" id="lm-main" class="action primary cursor-interaction"></button><button type="button" id="lm-rework" class="action cursor-interaction" hidden>仍需调整</button></div>
    </aside>
  </div>
  <div class="step-note" aria-live="polite"><strong id="lm-note-label"></strong><span id="lm-note"></span></div>
</div>
<script>
(() => {
  const root = document.getElementById('lm-design');
  const byId = id => document.getElementById('lm-' + id);
  const example = '解锁只增加资格，不能降低总等级，也不能自动上阵。';
  const fresh = () => ({ phase: 0, round: 1, draft: example, original: '', followup: '', submissions: [], resolved: false, accepted: false });
  let state = fresh();
  const escape = text => text.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  function submit(value) {
    return { round: value.round, version: value.round, original: value.original, followup: value.followup };
  }
  const check = fresh(); check.original = example;
  const fixed = submit(check); check.original = '之后的新文字';
  console.assert(fixed.original === example, '提交内容应独立保存');
  console.assert(!check.resolved, '提交和代理回应不代表人工解决');

  function render() {
    const p = state.phase, version = state.round + (p >= 4 ? 1 : 0);
    const stages = [0, 1, 2, 3, 4, 4, 4];
    root.querySelectorAll('[data-stage]').forEach(button => {
      if (+button.dataset.stage === stages[p]) button.setAttribute('aria-current', 'step'); else button.removeAttribute('aria-current');
    });
    byId('version').textContent = '逻辑 v' + version + ' · 示意版本';
    const roundStates = ['评审中', '评审中', '评审中', '已提交 · 待代理接收', '待复核', '待确认本轮', '已通过'];
    byId('round').textContent = '第 ' + state.round + ' 轮 · ' + roundStates[p];
    byId('comment-status').textContent = p === 0 ? '' : p === 1 ? '意见：输入中' : '意见：' + (p >= 5 ? '已解决' : p === 4 ? '待复核' : '待处理');
    byId('selected').classList.toggle('selected', p >= 1);
    byId('selection-note').hidden = p < 1;
    byId('selection-note').textContent = p === 1 ? '已圈选 3 个步骤' : '3 个步骤 · 1 条讨论';
    byId('delta').hidden = p < 4;
    byId('node-output').textContent = p >= 4 ? '总等级保持 · 已解锁集合新增 · 上阵保持' : '查看总等级、解锁集合与上阵选择';
    byId('graph-mode').textContent = p >= 4 ? '新版变化' : '现状逻辑';
    byId('result').textContent = p >= 4 ? '已展开三项状态的保持与变化，可据此复核。' : '查看步骤细节，核对规则与失败出口。';
    const content = byId('discussion');
    if (p === 0) {
      byId('panel-title').textContent = '先理解业务行为';
      content.innerHTML = '<p>这里检查资源、扣费，再增加解锁资格。</p><p>点击步骤可以查看条件、数据变化和失败出口。</p><p>整段规则或遗漏流程，也可以在场景级留下意见。</p>';
    } else if (p === 1) {
      byId('panel-title').textContent = state.round > 1 ? '在原讨论下补充意见' : '为所选流程留下意见';
      content.innerHTML = (state.original ? '<div class="thread"><p class="who">原意见 · 保留</p><p>' + escape(state.original) + '</p></div>' : '') + '<label for="lm-draft">问题与预期行为</label><textarea id="lm-draft" rows="4"></textarea><p class="who">保存后仍由你决定何时提交本轮。</p>';
      byId('draft').value = state.draft;
      byId('draft').addEventListener('input', event => { state.draft = event.target.value; byId('main').disabled = !state.draft.trim(); });
    } else {
      byId('panel-title').textContent = p === 2 ? '批注已保存 · 尚未提交' : p === 3 ? '本轮意见已固定' : '看回应，复核新逻辑';
      content.innerHTML = '<div class="thread"><p class="who">你 · 原意见 · 逻辑 v1</p><p>' + escape(state.original) + '</p>' + (state.followup ? '<div class="reply"><p class="who">你 · 后续补充</p><p>' + escape(state.followup) + '</p></div>' : '') + (p >= 4 ? '<div class="reply"><p class="who">代理 · 示例回应</p><p>已核对并补全等级与上阵保持规则，依据随新版回传。请复核当前变化。</p></div>' : '') + '</div>';
      if (p >= 3) content.innerHTML += '<div class="snapshot">本轮提交针对：逻辑 v' + state.round + '<br>原意见和目标上下文保持不变。</div>';
      if (p === 3) content.innerHTML += '<p>尚无代理接收回执。正式界面在收到回执后再显示“处理中”。</p>';
      if (p === 4) content.innerHTML += '<p>代理已回应。现在由你判断这条意见是否解决。</p>';
      if (p === 5) content.innerHTML += '<p>这条意见已由你确认解决。本轮评审仍待你单独确认。</p>';
      if (p === 6) content.innerHTML += '<p>已记录对本版、当前评审范围的业务确认。</p>';
    }
    const actions = ['圈选并批注', '保存批注', '提交本轮意见', '演示代理接收并回传', '确认此意见已解决', '通过本轮评审', '重新演示'];
    byId('main').textContent = actions[p];
    byId('main').disabled = p === 1 && !state.draft.trim();
    byId('rework').hidden = p !== 4 && p !== 5;
    const notes = [
      ['准备', '代理固定源码与逻辑版本，声明已展示的场景和未覆盖范围。'],
      ['批注', '画布内直接写；一条意见可以绑定节点、连线或一组步骤，保存后可继续补充。'],
      ['提交', '逐条保存与提交本轮分开。一次提交固定范围、版本、意见和目标上下文。'],
      ['处理', '代理收到意见后可修改、解释或提出异议；回复回到原讨论，原意见保留。'],
      ['复核', '新版突出业务变化，旧意见标为待复核。代理回复后仍由人判断结果。'],
      ['确认', '单条意见解决与本轮通过分开记录。'],
      ['完成', '保留本轮意见、回应、版本和人工确认，后续修改另起一轮。']
    ];
    byId('note-label').textContent = notes[p][0]; byId('note').textContent = notes[p][1];
  }
  byId('main').addEventListener('click', () => {
    const p = state.phase;
    if (p === 6) { state = fresh(); render(); return; }
    if (p === 1) { if (!state.draft.trim()) return; if (!state.original) state.original = state.draft.trim(); else state.followup = state.draft.trim(); }
    if (p === 2) state.submissions.push(submit(state));
    if (p === 4) state.resolved = true;
    if (p === 5) state.accepted = true;
    state.phase++; render();
  });
  byId('rework').addEventListener('click', () => { state.phase = 1; state.round++; state.draft = ''; state.resolved = false; state.accepted = false; render(); });
  root.querySelectorAll('[data-stage]').forEach(button => button.addEventListener('click', () => {
    const phase = +button.dataset.stage;
    const text = state.original || state.draft.trim() || example;
    state = fresh(); state.phase = phase;
    if (phase >= 2) state.original = text;
    if (phase >= 3) state.submissions.push(submit(state));
    render();
  }));
  render();
})();
</script>
</body>
</html>
