name: Diagnose Windows lock recovery

on:
  push:
    branches: ['debug/windows-lock-recovery']

permissions:
  contents: read

jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./internal/daemon -run '^TestStaleLockRecoveryHasOneConcurrentWinner$' -count=5 -v
