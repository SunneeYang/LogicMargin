name: Verify LogicMargin
on: [push, pull_request, workflow_dispatch]

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install archive tools on Windows
        if: runner.os == 'Windows'
        run: choco install zip unzip -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:agent

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install archive tools on Windows
        if: runner.os == 'Windows'
        run: choco install zip unzip -y --no-progress
      - run: npm ci
      - run: npm run test:agent
        env:
          LOGIC_MARGIN_TEST_NATIVE: '1'
