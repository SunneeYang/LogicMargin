name: Release LogicMargin

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-go.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: logic-margin-release-*
          path: artifacts
          merge-multiple: true
      - name: Verify native ZIPs, DSH bundle, versions and checksums
        run: node scripts/release-agent.mjs "$RELEASE_TAG" --verify
      - name: Publish immutable version
        shell: bash
        run: |
          release_notes=(--generate-notes)
          if [[ -f "docs/releases/${RELEASE_TAG}.md" ]]; then
            release_notes=(--notes-file "docs/releases/${RELEASE_TAG}.md")
          fi
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 artifacts/*.tgz artifacts/*.tgz.sha256 artifacts/SHA256SUMS --verify-tag --title "LogicMargin $RELEASE_TAG" "${release_notes[@]}"
