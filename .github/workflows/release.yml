name: Release LogicMargin

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install archive tools on Windows
        if: runner.os == 'Windows'
        run: choco install zip unzip -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:agent
      - run: node --test scripts/release-agent.test.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Prepare portable ZIP and SHA-256 checksum
        run: node scripts/release-agent.mjs "$RELEASE_TAG"
      - name: Verify committed plugin matches the release build
        run: git diff --exit-code -- plugins/logic-margin/skills/logic-margin/scripts/logic-margin.mjs
      - name: Publish immutable version
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 --verify-tag --title "LogicMargin $RELEASE_TAG" --generate-notes
