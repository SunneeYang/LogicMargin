name: Verify Go release
on:
  push:
    branches: [main, 'release/*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install archive tools on Windows
        if: runner.os == 'Windows'
        run: choco install zip unzip -y --no-progress
      - run: npm ci
      - run: node --test scripts/native-launcher.test.mjs
      - run: npm run test:dsh
      - name: Package the DeepSeek Harness bundle
        if: runner.os == 'Linux'
        run: npm run package:dsh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: logic-margin-release-dsh
          path: |
            artifacts/*.tgz
            artifacts/*.tgz.sha256
          if-no-files-found: error
      - run: npm test
      - run: npm run build
      - run: npm run test:release
      - run: node scripts/build-graph-precompute.mjs --check
      - run: node scripts/build-structure-parser.mjs --check
      - run: npm run build:go
      - name: Exercise Windows lock directory competition
        if: runner.os == 'Windows'
        run: go test ./internal/daemon -run 'TestWindowsLockProbeBusyErrors|TestAcquireLockSurvivesWindowsDestinationChurn|TestRollbackLockWindowsSharing' -count=25
      - name: Exercise Windows update status sharing
        if: runner.os == 'Windows'
        run: go test ./internal/update -run '^TestWindows(UpdateFileIOErrors|StatusMissingAndInvalid|StatusFileSharing)$' -count=10
      - run: go test -race -p 1 ./... -count=1
      - run: npm run test:agent
      - run: npm run test:go:compat
      - run: npm run test:dev
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: logic-margin-native-${{ runner.os }}
          path: artifacts/go/
          if-no-files-found: error

  ui:
    runs-on: ubuntu-latest
    container:
      # Preinstalled browsers and fonts avoid a runtime dependency on Ubuntu APT mirrors.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout for container build steps
        run: |
          # checkout scopes its trust configuration to a temporary HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Verify Playwright matches the browser image
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.64.1', 'Update the pinned Playwright image with the dependency')"
      - name: Verify the packaged Go review UI
        run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-margin-ui-results
          path: test-results/
          if-no-files-found: error

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, win32-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run package:agent -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: logic-margin-release-${{ matrix.target }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
